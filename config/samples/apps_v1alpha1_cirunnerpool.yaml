apiVersion: apps.example.com/v1alpha1
kind: CIRunnerPool
metadata:
  name: jeff-runner-pool
spec:
  # The GitHub username of the developer who owns this local Kind cluster.
  # The runner registers with this as a label so workflows can route to it
  # using: runs-on: [self-hosted, jeff-vincent]
  githubUsername: "jeff-vincent"

  # The repository this runner polls for CI jobs
  repository: "jeff-vincent/demo-kindling"

  # Reference to a Secret containing a GitHub PAT with `repo` scope (key: "github-token").
  # At startup the runner automatically exchanges the PAT for a short-lived
  # registration token via the GitHub API — no manual token juggling required.
  tokenSecretRef:
    name: github-runner-token
    key: github-token

  # Single runner — one dev, one local Kind cluster
  replicas: 1

  # Runner image (defaults to the official GitHub Actions runner)
  runnerImage: "ghcr.io/actions/actions-runner:latest"

  # Extra labels (username is always added automatically)
  labels:
    - linux

  # Uncomment to let this pool run `kindling snapshot --deploy` from a
  # workflow via the kindling-snapshot-deploy composite action --
  # swaps the build-agent sidecar's image for one that also has
  # helm/crane/kindling installed.
  # enableSnapshotDeploy: true
  # localClusterName: "kindling"   # whatever `kindling init` named this cluster

  # buildAgentEnv reaches the build-agent container specifically (Env
  # above only reaches the runner container) -- it's the only way to
  # get a credential into the long-running sidecar process that
  # actually runs `kindling snapshot --deploy`. Needed for an
  # authenticated --registry push (KINDLING_REGISTRY_PASSWORD) and for
  # any env var a --creds-config entry's fromEnv references. Always a
  # secretKeyRef, never a literal value here.
  # buildAgentEnv:
  #   - name: KINDLING_REGISTRY_USERNAME
  #     valueFrom:
  #       secretKeyRef:
  #         name: registry-credentials
  #         key: username
  #   - name: KINDLING_REGISTRY_PASSWORD
  #     valueFrom:
  #       secretKeyRef:
  #         name: registry-credentials
  #         key: password

  # Uncomment for GitHub Enterprise Server:
  # githubURL: "https://github.example.com"

---
# The Secret containing your GitHub PAT — replace the value.
# The operator exchanges this PAT for a short-lived registration token
# at runner startup, and a removal token at shutdown.
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-token
type: Opaque
stringData:
  github-token: "ghp_your_github_pat_here"

