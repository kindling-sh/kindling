# ─────────────────────────────────────────────────────────────────
# kindling-snapshot-deploy — Reusable composite action for running
# `kindling snapshot --deploy` (mode: deploy, the default) or
# `kindling snapshot --destroy` (mode: destroy -- see
# FULL_GITOPS_HANDOFF_WITH_UI_PARITY_TODO.md, item B4) via the
# snapshot-deploy-capable build-agent sidecar (see
# snapshot-deploy-runner-sidecar.md).
#
# Requires a CIRunnerPool with spec.enableSnapshotDeploy: true (and
# spec.localClusterName set). Hides the /builds signal-file protocol
# the same way kindling-build and kindling-deploy already do -- this
# action is the only place a workflow needs to know that protocol
# exists at all.
#
# The staging-kubeconfig input should always come from a GH Actions
# secret (e.g. ${{ secrets.STAGING_KUBECONFIG }}), never a literal --
# it's written straight to the shared /builds volume (mode 0600) and
# removed by the sidecar immediately after the deploy completes,
# success or failure. It is never logged, echoed, or persisted
# anywhere else.
# ─────────────────────────────────────────────────────────────────
name: "kindling-snapshot-deploy"
description: "Run kindling snapshot --deploy (or --destroy) via the build-agent sidecar"

inputs:
  name:
    description: "Unique request name (used for signal files: /builds/<name>.*)"
    required: true
  mode:
    description: "'deploy' (default) runs --deploy; 'destroy' runs --destroy instead, tearing down the staging release/resources this branch created -- registry is not required in destroy mode"
    required: false
    default: "deploy"
  registry:
    description: "Target container registry (passed through as --registry) -- required when mode is 'deploy', ignored (and not required) when mode is 'destroy'"
    required: false
    default: ""
  staging-context:
    description: "Kubeconfig context name for the staging cluster (passed through as --context)"
    required: true
  staging-kubeconfig:
    description: "Full kubeconfig YAML for the staging cluster -- pass ${{ secrets.STAGING_KUBECONFIG }}, never a literal value"
    required: true
  extra-args:
    description: "Additional `kindling snapshot` flags (e.g. --creds-config, --namespace, --ingress-services in deploy mode; --branch/--name/--namespace/--format overrides in destroy mode). --deploy/--registry/--context/--non-interactive (deploy mode) or --destroy/--context (destroy mode) are always added automatically."
    required: false
    default: ""
  timeout:
    description: "Max seconds to wait for the deploy to complete (ignored in destroy mode, which doesn't poll /builds)"
    required: false
    default: "600"

outputs:
  chart-path:
    description: "Path (in the GitHub Actions workspace) to the exported chart -- includes values-prod.yaml and MISSING_CREDENTIALS.md when those flags/conditions apply. Empty if the deploy failed."
    value: ${{ steps.copy-chart.outputs.chart-path }}

runs:
  using: "composite"
  steps:
    - id: deploy
      name: "snapshot ${{ inputs.mode == 'destroy' && '--destroy' || '--deploy' }} (${{ inputs.name }})"
      shell: bash
      env:
        REQ_NAME: ${{ inputs.name }}
        MODE: ${{ inputs.mode }}
        REGISTRY: ${{ inputs.registry }}
        STAGING_CONTEXT: ${{ inputs.staging-context }}
        STAGING_KUBECONFIG: ${{ inputs.staging-kubeconfig }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        DEPLOY_TIMEOUT: ${{ inputs.timeout }}
      run: |
        echo "🚀 Requesting snapshot-${MODE}: ${REQ_NAME}"

        # ── Write the staging kubeconfig secret to the shared /builds
        # volume -- the sole channel the build-agent sidecar can read
        # from. Never echoed, never written anywhere else.
        umask 077
        printf '%s' "${STAGING_KUBECONFIG}" > "/builds/${REQ_NAME}.staging-kubeconfig"

        # ── Write the (non-secret) kindling snapshot args and trigger
        # the sidecar's .snapshot-deploy handler. In deploy mode,
        # --output is forced to a path under the shared /builds volume,
        # and placed *after* EXTRA_ARGS so it always wins if a caller's
        # extra-args also happens to set --output (last occurrence wins
        # for kindling's flag parsing) -- the copy-chart step below
        # depends on knowing exactly where the chart landed, so this
        # path is never user-overridable. Destroy mode never exports a
        # chart at all, so no --output is needed -- the copy-chart step
        # simply finds nothing there and reports an empty chart-path,
        # with no destroy-mode-specific handling needed in that step.
        if [ "${MODE}" = "destroy" ]; then
          printf '%s' "--destroy --context ${STAGING_CONTEXT} ${EXTRA_ARGS}" \
            > "/builds/${REQ_NAME}.snapshot-deploy-args"
        else
          if [ -z "${REGISTRY}" ]; then
            echo "❌ registry input is required when mode is 'deploy' (the default)"
            exit 1
          fi
          printf '%s' "--deploy --registry ${REGISTRY} --context ${STAGING_CONTEXT} --non-interactive ${EXTRA_ARGS} --output /builds/${REQ_NAME}-chart" \
            > "/builds/${REQ_NAME}.snapshot-deploy-args"
        fi
        touch "/builds/${REQ_NAME}.snapshot-deploy"

        # ── Wait for completion ──────────────────────────────────
        WAITED=0
        while [ ! -f "/builds/${REQ_NAME}.snapshot-deploy-done" ]; do
          sleep 2
          WAITED=$((WAITED+2))
          if [ ${WAITED} -ge ${DEPLOY_TIMEOUT} ]; then
            echo "❌ snapshot-${MODE} ${REQ_NAME} timed out after ${DEPLOY_TIMEOUT}s"
            cat "/builds/${REQ_NAME}.snapshot-deploy-log" 2>/dev/null || true
            exit 1
          fi
        done

        # ── Check result ─────────────────────────────────────────
        cat "/builds/${REQ_NAME}.snapshot-deploy-log"
        EXIT_CODE=$(cat "/builds/${REQ_NAME}.snapshot-deploy-exitcode")
        if [ "${EXIT_CODE}" != "0" ]; then
          echo "❌ snapshot-${MODE} ${REQ_NAME} failed (exit ${EXIT_CODE})"
          exit "${EXIT_CODE}"
        fi
        echo "✅ snapshot-${MODE} ${REQ_NAME} complete"

    # ── Copy the exported chart out of /builds ──────────────────────
    # /builds is only shared between the runner and build-agent
    # containers -- it is NOT the GitHub Actions workspace, so nothing
    # written there (the chart, values-prod.yaml,
    # MISSING_CREDENTIALS.md) is visible to any later workflow step
    # (actions/upload-artifact, git add, gh pr comment, etc.) without
    # this copy. Runs even on failure (if: always()) so a failed
    # deploy's partial chart/log state is still inspectable, but only
    # actually copies if the directory exists -- a sufficiently early
    # failure (e.g. before exportSnapshot runs) may never create it.
    - id: copy-chart
      name: "Copy chart out of /builds (${{ inputs.name }})"
      if: always()
      shell: bash
      env:
        REQ_NAME: ${{ inputs.name }}
      run: |
        SRC="/builds/${REQ_NAME}-chart"
        DEST="${{ github.workspace }}/${REQ_NAME}-chart"
        if [ ! -d "${SRC}" ]; then
          echo "ℹ️  No chart directory at ${SRC} -- deploy likely failed before chart export"
          echo "chart-path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        cp -r "${SRC}" "${DEST}"
        rm -rf "${SRC}"
        echo "📦 Chart copied to ${DEST}"
        echo "chart-path=${DEST}" >> "$GITHUB_OUTPUT"
