name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Lint & static analysis ───────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go fmt check
        run: |
          UNFMT=$(gofmt -l .)
          if [ -n "$UNFMT" ]; then
            echo "❌ The following files are not formatted:"
            echo "$UNFMT"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/cmd/dashboard-ui/package-lock.json

      - name: Build dashboard UI
        run: cd cli/cmd/dashboard-ui && npm ci && npm run build

      - name: go vet
        run: |
          go vet ./...
          cd cli && go vet ./...

  # ── Unit tests (envtest) ─────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run operator tests
        run: make test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/cmd/dashboard-ui/package-lock.json

      - name: Build dashboard UI
        run: cd cli/cmd/dashboard-ui && npm ci && npm run build

      - name: Run CLI tests
        run: make test-cli

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  # ── Build operator + CLI ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build operator
        run: make build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/cmd/dashboard-ui/package-lock.json

      - name: Build dashboard UI
        run: cd cli/cmd/dashboard-ui && npm ci && npm run build

      - name: Build CLI
        run: make cli

      - name: Build Docker image
        run: make docker-build

  # ── End-to-end test on a real Kind cluster ───────────────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Kind
        run: |
          [ -f /usr/local/bin/kind ] || {
            curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/kind
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/cmd/dashboard-ui/package-lock.json

      - name: Build dashboard UI
        run: cd cli/cmd/dashboard-ui && npm ci && npm run build

      - name: Build CLI
        run: make cli

      - name: Pre-pull dependency images
        run: |
          # Pull lightweight dep images in parallel to speed up e2e
          for img in quay.io/brancz/kube-rbac-proxy:v0.18.1 \
                     mysql mongo rabbitmq:3-management nats memcached \
                     hashicorp/consul hashicorp/vault minio/minio influxdb \
                     jaegertracing/all-in-one:latest; do
            docker pull "$img" &
          done
          wait

      - name: Run E2E tests
        run: make e2e
        env:
          E2E_CLUSTER_NAME: kindling-e2e-ci

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/kindling-e2e-*.log
          retention-days: 7
